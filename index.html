<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farhad Hosseini</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-size: 48px;
            margin: 0 0 15px;
        }

        p {
            font-size: 20px;
            color: #666;
            margin-bottom: 35px;
        }

        .grammar-link {
            display: inline-block;
            padding: 14px 28px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            transition: 0.2s;
        }

        .grammar-link:hover {
            background: #444;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 40px;
            font-size: 14px;
            color: #999;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Hi, I'm Farhad 👋</h1>

        <p>
            Welcome to my website.
        </p>

        <a href="grammar.html" class="grammar-link">
            Learn Grammar
        </a>

        <footer>
            © 2026 Farhad Hosseini
        </footer>

    </main>

</body>
</html>
